[project]
name = "gts-messaging"
version = "0.1.0"
description = "GTS Messaging Infrastructure - pgmq client, consumer base, and message contracts"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/messaging"]
