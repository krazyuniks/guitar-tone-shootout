[project]
name = "gts-domain"
version = "0.1.0"
description = "GTS Domain - Domain entities, value objects, ports, and domain services"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gts"]
