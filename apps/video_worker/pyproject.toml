[project]
name = "gts-video-worker"
version = "0.1.0"
description = "GTS Video Worker - render_video pgmq consumer"
requires-python = ">=3.14"
dependencies = [
    "gts-domain",
    "gts-messaging",
    "gts-webapp",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgmq-sqlalchemy>=0.1.0",
]

[tool.uv.sources]
gts-domain = { workspace = true }
gts-messaging = { workspace = true }
gts-webapp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_worker"]
