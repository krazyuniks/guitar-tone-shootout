[project]
name = "gts-webapp"
version = "0.1.0"
description = "GTS Web Application - FastAPI backend serving SSR pages and API"
requires-python = ">=3.14"
dependencies = [
    "gts-core",
    "gts-audio",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "jinja2>=3.1.0",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.0",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.0",
    "cryptography>=44.0.0",
]

[tool.uv.sources]
gts-core = { workspace = true }
gts-audio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webapp"]
