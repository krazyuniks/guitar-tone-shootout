[project]
name = "gts-worker"
version = "0.1.0"
description = "GTS Worker - TaskIQ background jobs and pgmq message consumer"
requires-python = ">=3.12"
dependencies = [
    "gts-core",
    "gts-audio",
    "taskiq>=0.11.0",
    "taskiq-redis>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgmq-sqlalchemy>=0.1.0",
    "redis>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
]

[tool.uv.sources]
gts-core = { workspace = true }
gts-audio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
