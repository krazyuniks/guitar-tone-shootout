[project]
name = "gts-audio-worker"
version = "0.1.0"
description = "GTS Audio Worker - process_audio pgmq consumer"
requires-python = ">=3.14"
dependencies = [
    "gts-core",
    "gts-audio",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgmq-sqlalchemy>=0.1.0",
]

[tool.uv.sources]
gts-core = { workspace = true }
gts-audio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_worker"]
