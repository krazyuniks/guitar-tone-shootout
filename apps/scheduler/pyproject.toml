[project]
name = "gts-scheduler"
version = "0.1.0"
description = "GTS Scheduler - TaskIQ cron job scheduling"
requires-python = ">=3.14"
dependencies = [
    "gts-core",
    "taskiq>=0.11.0",
    "taskiq-redis>=1.0.0",
    "redis>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[tool.uv.sources]
gts-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scheduler"]
