[project]
name = "gts"
version = "0.1.0"
description = "Guitar Tone Shootout - Tone comparison platform"
requires-python = ">=3.14"
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Root package is a workspace meta-package — no Python source to ship.
# Point to README.md to satisfy hatchling's file discovery requirement.
only-include = ["README.md"]

[dependency-groups]
dev = [
    "ruff==0.15.1",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "import-linter>=2.1",
    "jsonschema>=4.20.0",
]
host = [
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "playwright>=1.49.0",
]

[tool.uv]
# CPU-only PyTorch — no GPU on this server, saves ~3GB of NVIDIA CUDA packages
# neural-amp-modeler pulls in librosa -> numba (Python <3.10 only).
# We only need NAM inference (nam.models), not training. Override to skip librosa.
override-dependencies = ["librosa ; python_version < '0'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.uv.workspace]
members = [
    "model/*",
    "infra/*",
    "sources/*",
    "apps/webapp",
    "apps/t3k_sync",
    "apps/audio_worker",
    "apps/shootout_orchestrator",
]

# =============================================================================
# Import Linter - Dependency Enforcement
# =============================================================================

[tool.importlinter]
root_packages = [
    "gts",
    "messaging",
    "audio",
    "video",
    "source_t3k",
    "webapp",
    "t3k_sync",
    "audio_worker",
    "shootout_orchestrator",
]
include_external_packages = true

# gts domain has zero dependencies on other project packages
[[tool.importlinter.contracts]]
name = "gts-isolation"
type = "forbidden"
source_modules = ["gts"]
forbidden_modules = [
    "messaging",
    "audio",
    "video",
    "source_t3k",
    "webapp",
    "t3k_sync",
    "audio_worker",
    "shootout_orchestrator",
]

# messaging has zero dependencies on other project packages
[[tool.importlinter.contracts]]
name = "messaging-isolation"
type = "forbidden"
source_modules = ["messaging"]
forbidden_modules = [
    "gts",
    "audio",
    "video",
    "source_t3k",
    "webapp",
    "t3k_sync",
    "audio_worker",
    "shootout_orchestrator",
]

# gts domain models must remain framework-agnostic.
[[tool.importlinter.contracts]]
name = "gts-domain-no-frameworks"
type = "forbidden"
source_modules = ["gts.domain"]
forbidden_modules = [
    "sqlalchemy",
    "fastapi",
    "starlette",
    "pydantic",
    "redis",
    "taskiq",
    "httpx",
    "pedalboard",
    "torch",
]

# gts ports must remain framework-agnostic.
[[tool.importlinter.contracts]]
name = "gts-ports-no-frameworks"
type = "forbidden"
source_modules = ["gts.ports"]
forbidden_modules = [
    "sqlalchemy",
    "fastapi",
    "starlette",
    "pydantic",
    "redis",
    "taskiq",
    "httpx",
    "pedalboard",
    "torch",
]

# gts records should remain transport contracts, not framework adapters.
[[tool.importlinter.contracts]]
name = "gts-records-no-adapter-frameworks"
type = "forbidden"
source_modules = ["gts.records"]
forbidden_modules = [
    "sqlalchemy",
    "fastapi",
    "starlette",
    "redis",
    "taskiq",
    "httpx",
    "pedalboard",
    "torch",
]

# gts services may use SQLAlchemy/pydantic for domain logic, but not web frameworks.
[[tool.importlinter.contracts]]
name = "gts-services-no-web-frameworks"
type = "forbidden"
source_modules = ["gts.services"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "redis",
    "taskiq",
    "httpx",
    "pedalboard",
    "torch",
]

# Audio can only depend on gts domain
[[tool.importlinter.contracts]]
name = "audio-dependencies"
type = "forbidden"
source_modules = ["audio"]
forbidden_modules = [
    "video",
    "source_t3k",
    "webapp",
    "t3k_sync",
    "audio_worker",
    "shootout_orchestrator",
]

# Video can only depend on gts domain
[[tool.importlinter.contracts]]
name = "video-dependencies"
type = "forbidden"
source_modules = ["video"]
forbidden_modules = [
    "audio",
    "source_t3k",
    "webapp",
    "t3k_sync",
    "audio_worker",
    "shootout_orchestrator",
]

# Source adapters can only depend on gts domain
[[tool.importlinter.contracts]]
name = "source-dependencies"
type = "forbidden"
source_modules = ["source_t3k"]
forbidden_modules = [
    "audio",
    "webapp",
    "t3k_sync",
    "audio_worker",
    "shootout_orchestrator",
]

# Webapp cannot depend on sources
[[tool.importlinter.contracts]]
name = "webapp-no-sources"
type = "forbidden"
source_modules = ["webapp"]
forbidden_modules = ["source_t3k"]

# =============================================================================
# Ruff Configuration
# =============================================================================

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "B904",   # raise from err (too noisy)
    "ARG001", # unused function argument (common in protocols/interfaces)
    "UP042",  # replace-str-enum (codebase uses str, Enum pattern)
    "RUF003", # ambiguous-unicode-character-comment (intentional unicode in comments)
    "RUF002", # ambiguous-unicode-character-docstring (intentional unicode in docstrings)
]

[tool.ruff.lint.isort]
known-first-party = [
    "gts",
    "messaging",
    "audio",
    "video",
    "source_t3k",
    "webapp",
    "t3k_sync",
    "audio_worker",
    "shootout_orchestrator",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002", "E402", "B017", "B011", "RUF043", "TCH001"]
# SQLAlchemy models need runtime imports for Mapped[] annotations — cannot move to TYPE_CHECKING
"apps/webapp/src/webapp/adapters/persistence/models/*.py" = ["TCH001", "TCH002", "TCH003"]
"apps/webapp/src/webapp/adapters/persistence/unit_of_work.py" = ["TCH002"]
"apps/webapp/src/webapp/services/*.py" = ["TCH001", "TCH002", "TCH003"]
"apps/webapp/src/webapp/api/**/*.py" = ["TCH001", "TCH002", "TCH003"]
"apps/webapp/src/webapp/auth/*.py" = ["TCH001", "TCH002", "TCH003"]
"apps/webapp/src/webapp/dependencies.py" = ["TCH001", "TCH002", "TCH003"]
"tests/unit/webapp/test_job_model.py" = ["TCH003"]
"infrastructure/migrations/**/*.py" = ["E501", "F401", "E402", "F811", "F821"]

# =============================================================================
# MyPy Configuration
# =============================================================================

[tool.pyright]
pythonVersion = "3.14"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "infrastructure/migrations/",
]

[[tool.mypy.overrides]]
module = [
    "pedalboard.*",
    "nam.*",
    "pyloudnorm.*",
    "torch.*",
    "pgmq.*",
    "soundfile.*",
    "scipy.*",
]
ignore_missing_imports = true

# =============================================================================
# Pytest Configuration
# =============================================================================

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "smoke: marks tests as smoke tests",
    "host_only: marks tests that must run on host, not in Docker",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["model", "infra", "sources", "apps"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
