# GTS engine manifest (ADR-0010 thin contract).
#
# The standalone worktree engine (~/Work/worktree) reads this to allocate a
# globally-unique slot and non-colliding host ports per feature worktree, then
# runs the project's own provision/gate/teardown hooks in scripts/worktree/.
# The engine knows nothing of Docker, compose, storage, migrations, volumes, or
# secrets - every one of those concerns lives inside the three hooks, driven by
# WORKTREE_SLOT and the WORKTREE_PORT_* values the engine injects. The full
# derivation (compose project, container names, postgres volume, subnet, storage
# binds, migrations, secrets) is implemented and documented by the three hooks
# under scripts/worktree/; DEVELOPMENT.md covers the up/gate/down workflow.
#
# Services declare only what the engine allocates a host port for: the FastAPI
# webapp (WORKTREE_PORT_WEBAPP) and its Postgres (WORKTREE_PORT_DB). nginx, astro,
# the workers, and cloudbeaver are not on the gate path and carry no host port;
# astro's build artefact is asserted inside the gate hook, not exposed as a port.

project = "gts"

[[service]]
name = "webapp"
default_port = 8000

[[service]]
name = "db"
default_port = 5432

[command]
provision = ["bash", "scripts/worktree/provision.sh"]
gate      = ["bash", "scripts/worktree/gate.sh"]
teardown  = ["bash", "scripts/worktree/teardown.sh"]
