<!-- Step 3: Review & Submit -->
<div class="space-y-6" x-show="step === 3" x-transition>
  <!-- Step header -->
  <div class="flex items-center gap-3">
    <div class="flex h-8 w-8 items-center justify-center rounded-full bg-[var(--color-accent-primary)] text-sm font-bold text-white">
      3
    </div>
    <h2 class="text-xl font-semibold">Review & Submit</h2>
  </div>

  <!-- Name input -->
  <div class="space-y-2">
    <label for="shootout-name" class="text-sm font-medium">
      Shootout Name *
    </label>
    <input
      type="text"
      id="shootout-name"
      x-model="shootoutName"
      placeholder="e.g., Marshall vs Mesa Comparison"
      class="w-full rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring"
      data-testid="shootout-name-input"
    />
  </div>

  <!-- Description input -->
  <div class="space-y-2">
    <label for="shootout-description" class="text-sm font-medium">
      Description (optional)
    </label>
    <textarea
      id="shootout-description"
      x-model="shootoutDescription"
      placeholder="Add notes about this comparison..."
      rows="3"
      class="w-full rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring"
      data-testid="shootout-description-input"
    ></textarea>
  </div>

  <!-- Summary cards -->
  <div class="grid md:grid-cols-2 gap-4">
    <!-- Chains summary -->
    <div class="p-4 rounded-lg border border-border bg-card">
      <h3 class="font-medium mb-3">
        Signal Chains (<span x-text="selectedChains.length"></span>)
      </h3>
      <ul class="space-y-2 text-sm">
        <template x-for="(chain, index) in selectedChains" :key="chain.id">
          <li class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full bg-muted flex items-center justify-center text-xs font-medium" x-text="index + 1"></span>
            <span class="truncate" x-text="chain.name"></span>
          </li>
        </template>
      </ul>
    </div>

    <!-- DI Track summary -->
    <div class="p-4 rounded-lg border border-border bg-card">
      <h3 class="font-medium mb-3">DI Track</h3>
      <template x-if="selectedTrack">
        <div class="text-sm space-y-1">
          <div class="font-medium" x-text="selectedTrack.title"></div>
          <div class="text-[var(--color-text-secondary)]">
            <span x-text="formatDuration(selectedTrack.duration_seconds)"></span> ·
            <span x-text="formatSampleRate(selectedTrack.sample_rate)"></span>
          </div>
          <template x-if="selectedTrack.guitar">
            <div class="text-[var(--color-text-secondary)]">
              Guitar: <span x-text="selectedTrack.guitar"></span>
            </div>
          </template>
          <template x-if="selectedTrack.description">
            <div class="text-[var(--color-text-muted)] line-clamp-2" x-text="selectedTrack.description"></div>
          </template>
        </div>
      </template>
    </div>
  </div>

  <!-- Error display -->
  <div
    x-show="submitError"
    class="flex items-center gap-2 p-4 rounded-lg border border-destructive/50 bg-destructive/10 text-destructive"
    x-transition
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 20 20"
      fill="currentColor"
      class="w-5 h-5 flex-shrink-0"
    >
      <path
        fill-rule="evenodd"
        d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z"
        clip-rule="evenodd"
      />
    </svg>
    <p class="text-sm" x-text="submitError"></p>
  </div>

  <!-- Navigation -->
  <div class="flex justify-between">
    <button
      type="button"
      @click="step = 2"
      :disabled="isSubmitting"
      class="inline-flex items-center px-4 py-2 border border-border rounded-md text-sm font-medium hover:bg-muted transition-colors disabled:opacity-50"
      data-testid="step3-back-btn"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
        fill="currentColor"
        class="w-4 h-4 mr-1"
      >
        <path
          fill-rule="evenodd"
          d="M12.79 5.23a.75.75 0 01-.02 1.06L8.832 10l3.938 3.71a.75.75 0 11-1.04 1.08l-4.5-4.25a.75.75 0 010-1.08l4.5-4.25a.75.75 0 011.06.02z"
          clip-rule="evenodd"
        />
      </svg>
      Back
    </button>
    <button
      type="button"
      @click="submitShootout()"
      :disabled="isSubmitting || !shootoutName.trim()"
      :class="{
        'opacity-50 cursor-not-allowed': isSubmitting || !shootoutName.trim()
      }"
      class="inline-flex items-center px-4 py-2 bg-[var(--color-accent-primary)] text-white rounded-md text-sm font-medium hover:opacity-90 transition-opacity"
      data-testid="submit-shootout-btn"
    >
      <template x-if="isSubmitting">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          class="w-4 h-4 mr-1 animate-spin"
        >
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
      </template>
      <template x-if="!isSubmitting">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 20 20"
          fill="currentColor"
          class="w-4 h-4 mr-1"
        >
          <path d="M11.983 1.907a.75.75 0 00-1.292-.657l-8.5 9.5A.75.75 0 002.75 12h6.572l-1.305 6.093a.75.75 0 001.292.657l8.5-9.5A.75.75 0 0017.25 8h-6.572l1.305-6.093z" />
        </svg>
      </template>
      <span x-text="isSubmitting ? 'Creating...' : 'Create Shootout'"></span>
    </button>
  </div>
</div>
