{% extends "layouts/base.html" %}
{% block title %}Browse Gear{% endblock %}
{% block content %}
<div data-testid="gear-browse-page">
  <h1 data-testid="gear-browse-heading">Browse Gear</h1>
  <select data-testid="gear-type-filter" hx-get="/fragments/gear/list" hx-target="#gear-list-container"></select>
  <select data-testid="manufacturer-filter" hx-get="/fragments/gear/list" hx-target="#gear-list-container"></select>
  <input data-testid="gear-search-input" hx-get="/fragments/gear/list" hx-trigger="keyup" />
  <div data-testid="gear-list-container"></div>
</div>
{% endblock %}
