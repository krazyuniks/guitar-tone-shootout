<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Guitar Tone Shootout{% endblock %}</title>

  <!-- Compiled Tailwind CSS with design tokens (stable name, no hash) -->
  <link rel="stylesheet" href="/_astro/styles.css">

  <!-- HTMX for dynamic HTML fragments -->
  <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>

  <!-- Alpine.js for client-side interactivity -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen">
  {% block content %}
  <!-- SSR page content goes here -->
  {% endblock %}

  {% block scripts %}
  <!-- Page-specific scripts go here -->
  {% endblock %}
</body>
</html>
