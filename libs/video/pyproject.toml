[project]
name = "gts-video"
version = "0.1.0"
description = "GTS Video Rendering - Remotion-based video composition"
requires-python = ">=3.14"
dependencies = [
    "gts-core",
]

[tool.uv.sources]
gts-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video"]
