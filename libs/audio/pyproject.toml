[project]
name = "gts-audio"
version = "0.1.0"
description = "GTS Audio Processing - NAM, IR, pedalboard, video composition"
requires-python = ">=3.14"
dependencies = [
    "gts-core",
    "pedalboard>=0.9.0",
    "pyloudnorm>=0.1.1",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "soundfile>=0.12.0",
    # NAM removed temporarily - Python 3.12 compatibility issue with librosa/numba
    # Will be added back when updated versions are available
]

[tool.uv.sources]
gts-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio"]
