# GTS consumer prerequisites for external Woof.
#
# Woof source: git@github.com:krazyuniks/woof.git
#
# Version specifications: "any" = presence-only check.
# Explicit floors ("X", "X.Y", "X.Y.Z") accepted as equal-or-greater.

[infra]
docker = "any"
just = "any"
git = "any"
gh = "any"

[wrappers]
cld = "any"
cod = "any"
agent-sync = "any"

[validators]
ajv = "any"
ajv-formats = "any"

[indexing]
ctags = "any"

[indexing.tree-sitter]
cli = "any"
grammars = ["python", "typescript"]

[lsp]
languages = ["python", "typescript"]

[github]
repo = "krazyuniks/guitar-tone-shootout"
