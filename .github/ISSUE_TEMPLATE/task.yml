name: Task
description: A task for AI-driven TDD development
title: "[Task]: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        This template creates tasks that map directly to agent task files.
        Fill in all sections for best results with AI agents.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What does this task accomplish? 2-3 sentences.
      placeholder: |
        Implement a contact form that allows users to submit inquiries.
        The form should validate input and store submissions in the database.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Specific, testable criteria. Each becomes a test.
      placeholder: |
        - [ ] Form renders name, email, and message fields
        - [ ] Email field rejects invalid format with error message
        - [ ] Submit button disabled while form is submitting
        - [ ] Valid submission creates record in database
        - [ ] Success message displayed after submission
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files to create/modify. Be specific.
      placeholder: |
        **Create:**
        - `src/lib/contact.ts` - validation and submission logic
        - `src/components/ContactForm.tsx` - form component
        
        **Modify:**
        - `src/routes/contact/+page.svelte` - add form to page
        - `prisma/schema.prisma` - add ContactSubmission model
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: What must be complete before this task?
      placeholder: |
        Blocked by: #45 (database schema)
        Blocked by: #46 (email service)
    validations:
      required: false

  - type: textarea
    id: technical-notes
    attributes:
      label: Technical Notes
      description: Implementation hints, constraints, or context.
      placeholder: |
        - Use Zod for validation schema
        - Email validation should match RFC 5322
        - Rate limit submissions to 5 per minute per IP
    validations:
      required: false

  - type: dropdown
    id: complexity
    attributes:
      label: Complexity
      options:
        - Small (< 2 hours)
        - Medium (2-4 hours)
        - Large (4-8 hours)
        - XL (needs breakdown)
    validations:
      required: true
