# GTS Docker Compose - Base Configuration
# Worktree-agnostic: no ports, no container names
# Use with docker-compose.override.yml for local development
#
# Override pattern:
#   docker-compose.yml          - Base config (this file, committed)
#   docker-compose.override.yml - Worktree-specific (auto-generated, gitignored)
#   docker-compose.traefik.yml  - Traefik/HTTPS (committed)
#   docker-compose.ci.yml       - CI isolation (committed)

services:
  # ==========================================================================
  # PostgreSQL - Dual database with pgmq extension
  # ==========================================================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gts
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gts_dev_password}
      POSTGRES_DB: gts_core
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      - ./infrastructure/docker/init-pgmq.sql:/docker-entrypoint-initdb.d/02-init-pgmq.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gts -d gts_core"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Redis - Job broker for worker/scheduler (jobs profile only)
  # Feature worktrees don't need Redis - only main runs background jobs
  # ==========================================================================
  redis:
    profiles:
      - jobs
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Webapp - FastAPI web application
  # ==========================================================================
  webapp:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      # Webapp only has access to gts_core - NO T3K database access
      # Worker is the bridge between databases via pgmq
      DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_core
      # No REDIS_URL - webapp doesn't need Redis (T3K rate limiting is worker's domain)
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:-dev_oauth_key_32_bytes_exactly!!}
      ENV: ${ENV:-development}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    volumes:
      - ./libs:/app/libs:ro
      - ./apps/webapp:/app/apps/webapp
      - ./frontend/astro/dist:/app/static:ro
      - upload_data:/app/uploads
      # Source code for execution
      - ./src:/app/src:ro
      - ./sources:/app/sources:ro
      - ./tests:/app/tests:ro
      # Infrastructure (migrations)
      - ./infrastructure/migrations:/app/infrastructure/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # nginx - Reverse proxy and static file server
  # ==========================================================================
  nginx:
    image: nginx:alpine
    environment:
      WEBAPP_HOST: webapp
      WEBAPP_PORT: 8000
      NGINX_PORT: ${NGINX_PORT:-9000}
    volumes:
      - ./infrastructure/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./frontend/astro/dist:/usr/share/nginx/html/static:ro
    depends_on:
      webapp:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Worker - TaskIQ background jobs and pgmq consumer
  # ==========================================================================
  worker:
    profiles:
      - jobs
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: ["taskiq", "worker", "worker.main:broker", "--workers", "1"]
    environment:
      DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_core
      T3K_DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_t3k_source
      REDIS_URL: redis://redis:6379
      ENV: ${ENV:-development}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    volumes:
      - ./libs:/app/libs:ro
      - ./apps/worker:/app/apps/worker
      - ./sources:/app/sources:ro
      - upload_data:/app/uploads
      - processed_data:/app/processed
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Scheduler - TaskIQ cron job scheduler
  # ==========================================================================
  scheduler:
    profiles:
      - jobs
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: ["taskiq", "scheduler", "scheduler.main:scheduler"]
    environment:
      DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_core
      REDIS_URL: redis://redis:6379
      ENV: ${ENV:-development}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    volumes:
      - ./libs:/app/libs:ro
      - ./apps/scheduler:/app/apps/scheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Astro - Build-only service (not in runtime stack)
  # ==========================================================================
  astro:
    profiles:
      - build
    build:
      context: ./frontend/astro
      dockerfile: Dockerfile
    volumes:
      - ./frontend/astro:/app
      - /app/node_modules
    working_dir: /app

  # ==========================================================================
  # CloudBeaver - Web-based database management (tools profile only)
  # ==========================================================================
  cloudbeaver:
    profiles:
      - tools
    image: dbeaver/cloudbeaver:latest
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    restart: unless-stopped

volumes:
  cloudbeaver_data:
    name: gts-cloudbeaver-${GTS_WORKTREE:-main}
  postgres_data:
    name: gts-postgres-${GTS_WORKTREE:-main}
  redis_data:
    name: gts-redis-${GTS_WORKTREE:-main}
  upload_data:
    name: gts-uploads-${GTS_WORKTREE:-main}
  processed_data:
    name: gts-processed-${GTS_WORKTREE:-main}
