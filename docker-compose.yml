# GTS Docker Compose - Base Configuration
# Worktree-agnostic: no ports, no container names
# Use with docker-compose.override.yml for local development
#
# Override pattern:
#   docker-compose.yml          - Base config (this file, committed)
#   docker-compose.override.yml - Worktree-specific (auto-generated, gitignored)
#   docker-compose.traefik.yml  - Traefik/HTTPS (committed)
#   docker-compose.ci.yml       - CI isolation (committed)

services:
  # ==========================================================================
  # PostgreSQL - Single gts_core database with pgmq extension
  # ==========================================================================
  db:
    image: ghcr.io/pgmq/pg18-pgmq:v1.10.0
    environment:
      POSTGRES_USER: gts
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gts_dev_password}
      POSTGRES_DB: gts_core
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/docker/init-core-db.sh:/docker-entrypoint-initdb.d/01-init-core-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gts -d gts_core"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ==========================================================================
  # Redis - lock + TaskIQ broker for jobs profile services
  # Feature worktrees don't need background workers
  # ==========================================================================
  redis:
    profiles:
      - jobs
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Webapp - FastAPI web application
  # ==========================================================================
  webapp:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      # Webapp only has access to gts_core - NO T3K database access
      # Worker is the bridge between databases via pgmq
      DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_core
      # No REDIS_URL - webapp doesn't need Redis (T3K rate limiting is worker's domain)
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY}
      GTS_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY}
      ENV: ${ENV:-development}
      GTS_STORAGE_ROOT: /app/storage
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
      - path: .env.secrets
        required: false
    volumes:
      - ./model:/app/model
      - ./infra:/app/infra
      - ./apps/webapp:/app/apps/webapp
      - ./apps/worker:/app/apps/worker
      - ./apps/t3k_sync:/app/apps/t3k_sync
      - ./apps/audio_worker:/app/apps/audio_worker
      - ./apps/video_worker:/app/apps/video_worker
      - ./frontend/astro/dist:/app/static
      - ./frontend/astro:/app/frontend/astro
      - ../gts-storage:/app/storage
      - ./sources:/app/sources
      - ./tests:/app/tests
      - ./workflow:/app/workflow
      - ./infrastructure/migrations:/app/infrastructure/migrations
      - ./infrastructure/docker:/app/infrastructure/docker
      - ./infrastructure/nginx:/app/infrastructure/nginx
      - ./.claude:/app/.claude
      - ./worktree:/app/worktree
      - ./docker-compose.yml:/app/docker-compose.yml
      - ./justfile:/app/justfile
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ==========================================================================
  # nginx - Reverse proxy and static file server
  # ==========================================================================
  nginx:
    image: nginx:alpine
    environment:
      WEBAPP_HOST: webapp
      WEBAPP_PORT: 8000
      NGINX_PORT: ${NGINX_PORT:-9000}
    volumes:
      - ./infrastructure/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template
      - ./frontend/astro/dist:/usr/share/nginx/html/static
      - ./infrastructure/nginx/error-pages:/usr/share/nginx/html/error-pages
    depends_on:
      webapp:
        condition: service_healthy
      astro:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Worker - admin API and transitional TaskIQ jobs
  # ==========================================================================
  worker:
    profiles:
      - jobs
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: ["python", "-m", "worker.entrypoint"]
    environment:
      DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_core
      REDIS_URL: redis://redis:6379
      ENV: ${ENV:-development}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY}
      GTS_STORAGE_ROOT: /app/storage
      PYTHONPATH: /app/apps/t3k_sync/src:/app/apps/audio_worker/src:/app/apps/video_worker/src
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
      - path: .env.secrets
        required: false
    volumes:
      - ./model:/app/model
      - ./infra:/app/infra
      - ./apps/worker:/app/apps/worker
      - ./apps/t3k_sync:/app/apps/t3k_sync
      - ./apps/audio_worker:/app/apps/audio_worker
      - ./apps/video_worker:/app/apps/video_worker
      - ./apps/webapp:/app/apps/webapp
      - ./sources:/app/sources
      - ../gts-storage:/app/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # T3K Sync - embedded scheduler + gear_sync consumer
  # ==========================================================================
  t3k-sync:
    profiles:
      - jobs
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.t3k-sync
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_core
      ENV: ${ENV:-development}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY}
      GTS_STORAGE_ROOT: /app/storage
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
      - path: .env.secrets
        required: false
    volumes:
      - ./model:/app/model
      - ./infra:/app/infra
      - ./apps/t3k_sync:/app/apps/t3k_sync
      - ./apps/worker:/app/apps/worker
      - ./apps/webapp:/app/apps/webapp
      - ./sources:/app/sources
      - ../gts-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ==========================================================================
  # Audio Worker - process_audio queue consumer
  # ==========================================================================
  audio-worker:
    profiles:
      - jobs
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.audio-worker
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_core
      REDIS_URL: redis://redis:6379
      ENV: ${ENV:-development}
      GTS_STORAGE_ROOT: /app/storage
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
      - path: .env.secrets
        required: false
    volumes:
      - ./model:/app/model
      - ./infra:/app/infra
      - ./apps/audio_worker:/app/apps/audio_worker
      - ./apps/worker:/app/apps/worker
      - ../gts-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ==========================================================================
  # Video Worker - render_video queue consumer (Remotion runtime base)
  # ==========================================================================
  video-worker:
    profiles:
      - jobs
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.video
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command:
      [
        "uvicorn",
        "--app-dir",
        "apps/video_worker/src",
        "video_worker.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8002",
      ]
    environment:
      DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_core
      REDIS_URL: redis://redis:6379
      ENV: ${ENV:-development}
      GTS_STORAGE_ROOT: /app/storage
      PYTHONPATH: /app/apps/webapp/src:/app/apps/worker/src:/app/sources/t3k/src
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
      - path: .env.secrets
        required: false
    volumes:
      - ./model/gts:/app/model/gts
      - ./model/video:/app/model/video
      - ./infra/messaging:/app/infra/messaging
      - ./apps/video_worker:/app/apps/video_worker
      - ./apps/webapp:/app/apps/webapp
      - ./apps/worker:/app/apps/worker
      - ./sources:/app/sources
      - ../gts-storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ==========================================================================
  # Astro - Watches source files and auto-rebuilds on change
  # ==========================================================================
  astro:
    build:
      context: ./frontend/astro
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      SHELL: /bin/sh
    volumes:
      - ./frontend/astro:/app
      - /app/node_modules
    working_dir: /app
    restart: unless-stopped

  # ==========================================================================
  # CloudBeaver - Web-based database management (tools profile only)
  # ==========================================================================
  cloudbeaver:
    profiles:
      - tools
    image: dbeaver/cloudbeaver:latest
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    restart: unless-stopped

volumes:
  cloudbeaver_data:
    name: gts-cloudbeaver-${GTS_WORKTREE:-main}
  postgres_data:
    name: gts-postgres-${GTS_WORKTREE:-main}
  redis_data:
    name: gts-redis-${GTS_WORKTREE:-main}
