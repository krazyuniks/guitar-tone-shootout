# GTS Docker Compose - Base Configuration
# Worktree-agnostic: no ports, no container names
# Use with docker-compose.override.yml for local development
#
# Override pattern:
#   docker-compose.yml          - Base config (this file, committed)
#   docker-compose.override.yml - Worktree-specific (auto-generated, gitignored)
#   docker-compose.traefik.yml  - Traefik/HTTPS (committed)
#   docker-compose.ci.yml       - CI isolation (committed)

services:
  # ==========================================================================
  # PostgreSQL - Dual database with pgmq extension
  # ==========================================================================
  db:
    image: ghcr.io/pgmq/pg18-pgmq:v1.10.0
    environment:
      POSTGRES_USER: gts
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gts_dev_password}
      POSTGRES_DB: gts_core
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      - ./infrastructure/docker/init-pgmq.sql:/docker-entrypoint-initdb.d/02-init-pgmq.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gts -d gts_core"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ==========================================================================
  # Redis - Job broker for worker/scheduler (jobs profile only)
  # Feature worktrees don't need Redis - only main runs background jobs
  # ==========================================================================
  redis:
    profiles:
      - jobs
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Webapp - FastAPI web application
  # ==========================================================================
  webapp:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      # Webapp only has access to gts_core - NO T3K database access
      # Worker is the bridge between databases via pgmq
      DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_core
      # No REDIS_URL - webapp doesn't need Redis (T3K rate limiting is worker's domain)
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY}
      GTS_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY}
      ENV: ${ENV:-development}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
      - path: .env.secrets
        required: false
    volumes:
      - ./libs:/app/libs:ro
      # libs/video needs to be writable for integration tests (temp files)
      - ./libs/video:/app/libs/video
      - ./apps/webapp:/app/apps/webapp
      - ./apps/scheduler:/app/apps/scheduler:ro
      - ./apps/worker:/app/apps/worker:ro
      - ./frontend/astro/dist:/app/static:ro
      - ./frontend/astro:/app/frontend/astro:ro
      - upload_data:/app/uploads
      # Source code for execution
      - ./src:/app/src:ro
      - ./sources:/app/sources:ro
      - ./tests:/app/tests:ro
      # Infrastructure (migrations, docker configs, nginx error pages)
      - ./infrastructure/migrations:/app/infrastructure/migrations:ro
      - ./infrastructure/docker:/app/infrastructure/docker:ro
      - ./infrastructure/nginx:/app/infrastructure/nginx:ro
      # Claude skills (for documentation tests)
      - ./.claude:/app/.claude:ro
      # Worktree templates for integration tests
      - ./worktree:/app/worktree:ro
      # Docker compose files for integration tests
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      # Tooling files for integration tests
      - ./justfile:/app/justfile:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      # Scripts (CLI tools)
      - ./scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ==========================================================================
  # nginx - Reverse proxy and static file server
  # ==========================================================================
  nginx:
    image: nginx:alpine
    environment:
      WEBAPP_HOST: webapp
      WEBAPP_PORT: 8000
      NGINX_PORT: ${NGINX_PORT:-9000}
    volumes:
      - ./infrastructure/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./frontend/astro/dist:/usr/share/nginx/html/static:ro
      - ./infrastructure/nginx/error-pages:/usr/share/nginx/html/error-pages:ro
    depends_on:
      webapp:
        condition: service_healthy
      astro:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Worker - TaskIQ background jobs and pgmq consumer
  # ==========================================================================
  worker:
    profiles:
      - jobs
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: ["python", "-m", "worker.entrypoint"]
    environment:
      DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_core
      T3K_DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_t3k_source
      REDIS_URL: redis://redis:6379
      ENV: ${ENV:-development}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
      - path: .env.secrets
        required: false
    volumes:
      - ./libs:/app/libs:ro
      - ./apps/worker:/app/apps/worker
      - ./apps/webapp:/app/apps/webapp:ro
      - ./sources:/app/sources:ro
      - upload_data:/app/uploads
      - processed_data:/app/processed
      - processed_data:/processed_data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Scheduler - TaskIQ cron job scheduler
  # ==========================================================================
  scheduler:
    profiles:
      - jobs
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: ["taskiq", "scheduler", "scheduler.main:scheduler"]
    environment:
      DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_core
      DB_PASSWORD: ${DB_PASSWORD:-gts_dev_password}
      REDIS_URL: redis://redis:6379
      ENV: ${ENV:-development}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
      - path: .env.secrets
        required: false
    volumes:
      - ./libs:/app/libs:ro
      - ./apps/scheduler:/app/apps/scheduler
      - ../backups:/app/backups
      - ./sources:/app/sources:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Astro - Watches source files and auto-rebuilds on change
  # ==========================================================================
  astro:
    build:
      context: ./frontend/astro
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      SHELL: /bin/sh
    volumes:
      - ./frontend/astro:/app
      - /app/node_modules
    working_dir: /app
    restart: unless-stopped

  # ==========================================================================
  # Video - Remotion video rendering service (Node.js + Chromium + Python)
  # ==========================================================================
  video:
    profiles:
      - jobs
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.video
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      ENV: ${ENV:-development}
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
      - path: .env.secrets
        required: false
    volumes:
      - ./libs/core:/app/libs/core:ro
      - ./libs/video:/app/libs/video
      - upload_data:/app/uploads
      - processed_data:/app/processed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # CloudBeaver - Web-based database management (tools profile only)
  # ==========================================================================
  cloudbeaver:
    profiles:
      - tools
    image: dbeaver/cloudbeaver:latest
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    restart: unless-stopped

volumes:
  cloudbeaver_data:
    name: gts-cloudbeaver-${GTS_WORKTREE:-main}
  postgres_data:
    name: gts-postgres-${GTS_WORKTREE:-main}
  redis_data:
    name: gts-redis-${GTS_WORKTREE:-main}
  upload_data:
    name: gts-uploads-${GTS_WORKTREE:-main}
  processed_data:
    name: gts-processed-${GTS_WORKTREE:-main}
