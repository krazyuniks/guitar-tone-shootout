services:
  # ==========================================================================
  # PostgreSQL - Dual database with pgmq extension
  # ==========================================================================
  db:
    image: postgres:16-alpine
    container_name: gts-db-${GTS_WORKTREE:-main}
    environment:
      POSTGRES_USER: gts
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gts_dev_password}
      POSTGRES_DB: gts_core
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      - ./infrastructure/docker/init-pgmq.sql:/docker-entrypoint-initdb.d/02-init-pgmq.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gts -d gts_core"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Redis - Session, cache, and job broker
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: gts-redis-${GTS_WORKTREE:-main}
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # Backend - FastAPI web application
  # ==========================================================================
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: gts-backend-${GTS_WORKTREE:-main}
    environment:
      # Backend only has access to gts_core - NO T3K database access
      # Worker is the bridge between databases via pgmq
      DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_core
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:-dev_oauth_key_32_bytes_exactly!!}
      ENV: ${ENV:-development}
    volumes:
      - ./libs:/app/libs:ro
      - ./apps/webapp:/app/apps/webapp
      - ./frontend/astro/dist:/app/static:ro
      - upload_data:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # nginx - Reverse proxy and static file server
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: gts-nginx-${GTS_WORKTREE:-main}
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8000
      NGINX_PORT: ${NGINX_PORT:-9000}
    volumes:
      - ./infrastructure/nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./frontend/astro/dist:/usr/share/nginx/html/static:ro
    ports:
      - "${NGINX_PORT:-9000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Worker - TaskIQ background jobs and pgmq consumer
  # ==========================================================================
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: gts-worker-${GTS_WORKTREE:-main}
    environment:
      DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_core
      T3K_DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_t3k_source
      REDIS_URL: redis://redis:6379
      ENV: ${ENV:-development}
    volumes:
      - ./libs:/app/libs:ro
      - ./apps/worker:/app/apps/worker
      - upload_data:/app/uploads
      - processed_data:/app/processed
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Scheduler - TaskIQ cron job scheduler
  # ==========================================================================
  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.scheduler
    container_name: gts-scheduler-${GTS_WORKTREE:-main}
    environment:
      DATABASE_URL: postgresql+asyncpg://gts:${DB_PASSWORD:-gts_dev_password}@db:5432/gts_core
      REDIS_URL: redis://redis:6379
      ENV: ${ENV:-development}
    volumes:
      - ./libs:/app/libs:ro
      - ./apps/scheduler:/app/apps/scheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Astro - Build-only service (not in runtime stack)
  # ==========================================================================
  astro:
    profiles:
      - build
    build:
      context: ./frontend/astro
      dockerfile: Dockerfile
    container_name: gts-astro-${GTS_WORKTREE:-main}
    volumes:
      - ./frontend/astro:/app
      - /app/node_modules
    working_dir: /app

volumes:
  postgres_data:
    name: gts-postgres-${GTS_WORKTREE:-main}
  redis_data:
    name: gts-redis-${GTS_WORKTREE:-main}
  upload_data:
    name: gts-uploads-${GTS_WORKTREE:-main}
  processed_data:
    name: gts-processed-${GTS_WORKTREE:-main}
