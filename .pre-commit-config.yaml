# prek configuration (compatible with pre-commit)
# Uses built-in Rust-native hooks for maximum speed
# Run: prek run --all-files
# Install: prek install
#
# Auto-fixes lint/format issues on commit. Review changes in git diff.

repos:
  # Built-in Rust-native hooks (instant execution, no environment setup)
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # Ruff linting and formatting (auto-fix enabled)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Local hooks (all via just or scripts/)
  - repo: local
    hooks:
      - id: check-dev-docs
        name: Validate dev-docs exist
        entry: scripts/check-dev-docs.sh
        language: system
        always_run: true
        pass_filenames: false

      - id: astro-lint
        name: Astro lint (graceful if Docker not running)
        entry: scripts/astro-lint.sh
        language: system
        files: \.(ts|tsx|astro|css)$
        pass_filenames: false
