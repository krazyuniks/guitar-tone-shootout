# prek configuration (compatible with pre-commit)
# Uses built-in Rust-native hooks for maximum speed
# Run: prek run --all-files
# Install: prek install
#
# Auto-fixes lint/format issues on commit. Review changes in git diff.
# Python linting runs inside Docker (single source of truth for ruff version).

repos:
  # Built-in Rust-native hooks (instant execution, no environment setup)
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # All project hooks run via Docker — no host Python tools
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: just lint
        language: system
        types: [python]
        pass_filenames: false

      - id: check-dev-docs
        name: Validate dev-docs exist
        entry: scripts/check-dev-docs.sh
        language: system
        always_run: true
        pass_filenames: false

      - id: astro-lint
        name: Astro lint
        entry: scripts/astro-lint.sh
        language: system
        files: \.(ts|tsx|astro|css)$
        pass_filenames: false
