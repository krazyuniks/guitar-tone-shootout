# Default epic configuration profile.
# Copied to .planning/epics/E{N}/config.toml per epic.
# User selects options interactively during Stage 4 setup.

[models]
# Planner and plan critic (Stage 3)
planner = "opus"
plan_critic = "codex"

# Story implementor and critics (Stage 4)
# Constraint: story_critic != implementor, epic_critic != implementor
implementor = "codex"
story_critic = "opus"
epic_critic = "opus"

[budgets.planning]
max_turns = 50
timeout = 1800

[budgets.implementation]
max_turns = 40
timeout = 600

[budgets.validation]
max_turns = 15
timeout = 600

[budgets.critique_plan]
max_turns = 20
timeout = 600

[budgets.critique_story]
max_turns = 15
timeout = 600

[budgets.critique_epic]
max_turns = 20
timeout = 600

[budgets.gap_detection]
max_turns = 30
timeout = 1800

# MCP servers per dispatch role.
# Named servers are resolved from ~/.claude/settings.json + ~/.claude.json
# Any agent that inspects code gets serena + pyright.
# Web-facing tasks add chrome-devtools + playwright.
[mcp]
planning = ["serena", "pyright"]
implementation = ["serena", "pyright"]
critique = ["serena", "pyright"]
validation = []
gap_detection = ["serena", "pyright"]
